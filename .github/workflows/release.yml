# Builds the binaries of a release, and publishes them only from a tag.
#
# A run started by hand builds every host and computes every checksum, and it
# publishes nothing. That is the way to test this file without a release.
#
# The job that publishes is the only job that holds a write token, and it runs
# only for a tag. The attestation is made there too.
#
# The files have no version in their names, so the installers and
# `odd update` can read them at releases/latest/download/<file>.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      # A release that lacks one host is not a release.
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      # --locked builds the dependency versions that Cargo.lock names. Linux
      # builds against musl, so the binary carries its C library and runs on
      # any distribution. No dependency of odd compiles C.
      - name: build
        run: cargo build --release --locked -p alltheoddities --target ${{ matrix.target }}

      - name: collect
        shell: bash
        run: |
          mkdir out
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=".exe" ;; esac
          cp "target/${{ matrix.target }}/release/odd${suffix}" "out/odd-${{ matrix.target }}${suffix}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odd-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  hash:
    name: hash the files and read the version
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: odd-*
          path: dist/
          merge-multiple: true

      # One machine hashes every file, so every checksum comes from the same
      # tool. The Linux x64 binary gives the version and the codename.
      - name: hash and name
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum odd-* > SHA256SUMS
          cat SHA256SUMS
          chmod +x odd-x86_64-unknown-linux-musl
          ./odd-x86_64-unknown-linux-musl --version | tee ../VERSION

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            VERSION
          if-no-files-found: error

  release:
    name: publish a draft release
    needs: hash
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .

      # VERSION holds "odd 2026.12.0 (Astrolabe)". A tag that disagrees with
      # it gives a binary whose --version names another release.
      - name: check that the tag names the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          read -r _ version codename < VERSION
          codename=${codename#(}
          codename=${codename%)}
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME} and odd says ${version}." >&2
            exit 1
          fi
          month=${version%.*}
          echo "title=${month} \"${codename}\"" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/odd-*

      # A draft, so that a person reads the assets before anybody else can
      # download them.
      - name: open the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "${TITLE}" \
            --generate-notes
