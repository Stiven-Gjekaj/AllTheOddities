# Checks each change on Linux, macOS and Windows.
#
# Every action is pinned to the commit of a release, and not to a tag. A tag
# moves. The pins are the same as in AllTheTools.
#
# dtolnay/rust-toolchain usually reads the toolchain from the name of the ref,
# as in `@stable`. A pinned commit has no such name, so the toolchain is
# named in `with`. It is the version in rust-toolchain.toml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: check on ${{ matrix.os }}
    strategy:
      # One host that fails must not hide the state of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p alltheoddities --locked
      - name: run the commands that change nothing
        run: sh scripts/smoke.sh target/debug/odd

  # The installers run against a fake release on a local web server.
  install-unix:
    name: the installer on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh tests/install.sh

  install-windows:
    name: the installer in ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        # powershell is Windows PowerShell 5.1, the shell of a new computer.
        # pwsh is PowerShell 7.
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p alltheoddities --locked
      - run: ./tests/install.ps1 -Odd target/debug/odd.exe

  # A part of the code that belongs to one host compiles only on that host.
  # `cargo clippy` does not link, so this finds a break from Linux at once.
  other-targets:
    name: check the other hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          components: clippy
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, aarch64-apple-darwin, x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --target aarch64-pc-windows-msvc -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-unknown-linux-musl -- -D warnings
